['gpuDrivenPerformance': false, 'gpuDrivenPerformanceCheck': true].each { taskName, automated ->
    task(taskName, type: JavaExec, dependsOn: 'classes') {
        group = automated ? 'verification' : 'application'
        main = 'jme3test.gpuDrivenRendering.TestGpuDrivenPerformance'
        classpath = sourceSets.main.runtimeClasspath
        maxHeapSize = '8g'
        // Optional JDK 11+ CPU/GC recording; output is local to this project.
        if (project.hasProperty('gpuProfile')) {
            jvmArgs "-XX:StartFlightRecording=filename=${rootProject.file('.gradle/gpu-scene.jfr')},settings=profile,dumponexit=true"
        }
        args "--count=${project.findProperty('gpuInstances') ?: '100000'}"
        args "--moving=${project.findProperty('gpuMoving') ?: '1000'}"
        args "--frames=${project.findProperty('gpuMeasureFrames') ?: '600'}"
        if (project.hasProperty('gpuLinearUpdates')) {
            args '--linear-updates'
