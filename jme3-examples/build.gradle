        }
        args "--count=${project.findProperty('gpuInstances') ?: '100000'}"
        args "--moving=${project.findProperty('gpuMoving') ?: '1000'}"
        args "--frames=${project.findProperty('gpuMeasureFrames') ?: '600'}"
