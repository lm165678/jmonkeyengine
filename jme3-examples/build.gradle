        group = 'verification'
        description = 'Checks tiled deferred rendering and Forward mode round trips offscreen.'
        dependsOn 'classes'
        mainClass = 'jme3test.light.TestTiledDeferred'
        classpath = sourceSets.main.runtimeClasspath
        args(['--smoke'] + extraArgs)
    }
}
