//apply plugin:'application'

task tiledSceneBenchmark(type: JavaExec, dependsOn: 'classes') {
    group = 'verification'
    main = 'jme3test.renderpath.BenchmarkTiledDeferred'
    classpath = sourceSets.main.runtimeClasspath
    if (project.hasProperty('nearView')) args '--near'
    if (project.hasProperty('downView')) args '--down'
}

task renderPathSmoke(type: JavaExec, dependsOn: 'classes') {
    group = 'verification'
    main = 'jme3test.renderpath.RenderPathSmoke'
    classpath = sourceSets.main.runtimeClasspath
    args project.findProperty('renderPathExample') ?: 'TestDeferredShading'
    if (project.hasProperty('renderPathView')) args project.property('renderPathView')
}

def renderPathScenes = [
    'TerrainTestAdvancedRenderPath', 'TerrainTestAndroidRenderPath',
    'TestDeferredPBRShading', 'TestDeferredShading', 'TestDeferredShadingPathShadow',
    'TestPBRTerrainAdvancedRenderPath', 'TestPBRTerrainRenderPath',
    'TestRenderPathChanged', 'TestRenderPathPointDirectionalAndSpotLightShadows',
    'TestShadingModel', 'TestSimpleDeferredLighting', 'TestTileBasedDeferredShading',
    'TestDeferredFeatures', 'TestRenderPathIsolation', 'TestDeferredTerrainFeatures'
]
task renderPathSuite {
    group = 'verification'
    description = 'Runs all ported render-path scenes and feature/isolation pixel regressions.'
}

task renderPipelineSuite {
    group = 'verification'
    description = 'Checks direct Pipeline installation, CPU/GPU policies and replacement lifecycle.'
}
def previousDirectPipelineTask = null
['TestDeferredFeatures', 'TestRenderPathIsolation'].each { scene ->
    def directTask = tasks.create(name: "renderPipelineCheck${scene}", type: JavaExec) {
        dependsOn 'classes'
        main = 'jme3test.renderpath.RenderPathSmoke'
        classpath = sourceSets.main.runtimeClasspath
        args scene
        systemProperty 'renderpath.direct', 'true'
    }
    if (previousDirectPipelineTask != null) directTask.mustRunAfter previousDirectPipelineTask
    previousDirectPipelineTask = directTask
    renderPipelineSuite.dependsOn directTask
}
def previousSceneTask = null
renderPathScenes.each { scene ->
    def sceneTask = tasks.create(name: "renderPathCheck${scene}", type: JavaExec) {
        dependsOn 'classes'
        main = 'jme3test.renderpath.RenderPathSmoke'
        classpath = sourceSets.main.runtimeClasspath
        args scene
    }
    // Keep graphics checks sequential even when Gradle parallelism is enabled.
    if (previousSceneTask != null) sceneTask.mustRunAfter previousSceneTask
    previousSceneTask = sceneTask
    renderPathSuite.dependsOn sceneTask
}

// Offscreen regression checks for the optional tiled deferred renderer.
['tiledDeferredSmoke': [], 'tiledDeferredSmokeGL33': ['--gl33'],
 'tiledDeferredSmokeOverflow': ['--overflow'],
 'tiledDeferredBenchmark': ['--benchmark']].each { taskName, extraArgs ->
    tasks.create(name: taskName, type: JavaExec) {
        group = 'verification'
        description = 'Checks tiled deferred rendering and Forward mode round trips offscreen.'
        dependsOn 'classes'
        main = 'jme3test.light.TestTiledDeferred'
        classpath = sourceSets.main.runtimeClasspath
        args(['--smoke'] + extraArgs)
    }
}

if (!hasProperty('mainClass')) {
    ext.mainClass = 'jme3test.TestChooser'
}

task run(dependsOn: 'build', type:JavaExec) {
    main = mainClass
    classpath = sourceSets.main.runtimeClasspath

    if (System.properties['java.util.logging.config.file'] != null) {
        systemProperty "java.util.logging.config.file", System.properties['java.util.logging.config.file']
    }

    if( assertions  == "true" ){
        enableAssertions = true;
    }
}

dependencies {
    compile project(':jme3-core')
    compile project(':jme3-desktop')
    compile project(':jme3-effects')

    // EITHER use jme3-bullet + jme3-bullet-native OR ELSE jme3-jbullet
    compile project(':jme3-bullet')
    compile project(':jme3-bullet-native')
//    compile project(':jme3-jbullet')

    compile project(':jme3-jogg')
    compile project(':jme3-lwjgl')
//    compile project(':jme3-lwjgl3')
    compile project(':jme3-networking')
    compile project(':jme3-niftygui')
    compile project(':jme3-plugins')
    compile project(':jme3-terrain')
    compile project(':jme3-testdata')
}

jar.doFirst{
    manifest {
        attributes('Manifest-Version'       : '1.0',
//                'Created-By'             : vendor,
//                'Specification-Title'    : appName,
//                'Specification-Version'  : jmeVersion,
//                'Specification-Vendor'   : "jMonkeyEngine",
//                'Implementation-Title'   : appName,
//                'Implementation-Version' : version,
//                'Implementation-Vendor'  : vendor,
                'Main-Class'             : getProperty('mainClass'),
                // Add dependencies to manifest, remove version
                'Class-Path'             : configurations.compile.resolvedConfiguration.resolvedArtifacts.collect {
                                                        'lib/' +
                                                        it.name +
                                                        (it.classifier != null ? '-' + it.classifier : '') +
                                                        '.' + it.extension }.join(' ')
        )
    }
}

task dist (dependsOn: ['build', ':jme3-bullet:jar', ':jme3-android:jar', \
                       ':jme3-android-native:jar', ':jme3-bullet-native-android:jar', \
                       ':jme3-bullet-native:jar']) {
    doLast {
        // Copy all dependencies to ../dist/lib, remove versions from jar files
        configurations.compile.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            copy {
                from artifact.file
                into '../dist/lib'
                if(artifact.classifier != null){
                    rename { "${artifact.name}-${artifact.classifier}.${artifact.extension}" }
                } else{
                    rename { "${artifact.name}.${artifact.extension}" }
                }
            }
        }
        copy {
            from jar.archivePath
            into '../dist'
            rename { "jMonkeyEngine3.jar" }
        }

        // Copy bullet packages, remove version
        copy {
            from project(':jme3-bullet').jar.archivePath
            into '../dist/opt/native-bullet'
            rename {project(':jme3-bullet').name+".jar"}
        }
        copy {
            from project(':jme3-bullet-native').jar.archivePath
            into '../dist/opt/native-bullet'
            rename {project(':jme3-bullet-native').name+".jar"}
        }

        // Copy android packages, remove version
        copy {
            from project(':jme3-android').jar.archivePath
            into '../dist/opt/android'
            rename {project(':jme3-android').name+".jar"}
        }
        copy {
            from project(':jme3-android-native').jar.archivePath
            into '../dist/opt/android'
            rename {project(':jme3-android-native').name+".jar"}
        }
        copy {
            from project(':jme3-bullet-native-android').jar.archivePath
            into '../dist/opt/native-bullet'
            rename {project(':jme3-bullet-native-android').name+".jar"}
        }
    }
}
