// Separate runtime classpaths are essential: LWJGL 2 and 3 implement the same
// engine backend class names and must never be loaded together.
evaluationDependsOn(':jme3-lwjgl3')
['gpuSettingsLwjgl3Check': ['TestGpuSceneSettings', []],
 'gpuHiZLwjgl3Check': ['TestHiZOcclusion', ['--smoke', '--compaction']],
 'gpuCombinedLwjgl3Check': ['TestGpuDrivenRendering', ['--smoke', '--mdi', '--bindless']]].each { taskName, config ->
    task(taskName, type: JavaExec, dependsOn: ['classes', ':jme3-lwjgl3:classes']) {
        group = 'verification'
        main = 'jme3test.gpuDrivenRendering.' + config[0]
        args config[1]
        classpath = files(sourceSets.main.output,
                configurations.runtimeClasspath.filter {
                    !it.name.startsWith('jme3-lwjgl-') && !it.name.startsWith('lwjgl-2.') &&
                    !it.name.startsWith('lwjgl-platform-')
                }, project(':jme3-lwjgl3').sourceSets.main.runtimeClasspath)
    }
}

